server {
    listen       8080 default_server;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes like /capture, /chat, /confirm
    # return the bundle instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets, no-cache for the entry HTML.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
