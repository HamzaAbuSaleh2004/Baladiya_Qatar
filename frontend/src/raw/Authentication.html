<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Baladiya - Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#ead5d7",
                        "surface-tint": "#a93151",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#c6c6c7",
                        "tertiary-container": "#00562e",
                        "on-secondary": "#ffffff",
                        "surface-container": "#ffe9eb",
                        "on-tertiary-fixed": "#00210e",
                        "tertiary": "#003c1f",
                        "on-tertiary-container": "#81ca97",
                        "on-primary-fixed-variant": "#89173a",
                        "on-error": "#ffffff",
                        "secondary-container": "#dfe0e0",
                        "outline": "#8a7174",
                        "inverse-on-surface": "#ffecee",
                        "primary": "#6c0028",
                        "on-primary-fixed": "#400014",
                        "secondary-fixed": "#e2e2e2",
                        "error-container": "#ffdad6",
                        "on-background": "#24191a",
                        "on-secondary-container": "#616363",
                        "on-tertiary-fixed-variant": "#00522c",
                        "primary-fixed": "#ffd9de",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#f3dddf",
                        "secondary": "#5d5f5f",
                        "surface": "#fff8f7",
                        "inverse-surface": "#3a2d2f",
                        "tertiary-fixed": "#a8f3bd",
                        "on-surface-variant": "#574144",
                        "outline-variant": "#ddbfc3",
                        "on-surface": "#24191a",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#ffb2be",
                        "surface-bright": "#fff8f7",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#ff9eaf",
                        "surface-container-lowest": "#ffffff",
                        "background": "#fff8f7",
                        "primary-container": "#8d1b3d",
                        "surface-container-high": "#f9e3e5",
                        "on-secondary-fixed-variant": "#454747",
                        "inverse-primary": "#ffb2be",
                        "surface-container-low": "#fff0f1",
                        "surface-container-highest": "#f3dddf",
                        "on-secondary-fixed": "#1a1c1c",
                        "tertiary-fixed-dim": "#8dd7a3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter": "24px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "xl": "40px",
                        "container-max": "1280px",
                        "unit": "4px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Public Sans"],
                        "label-sm": ["Public Sans"],
                        "headline-xl": ["Public Sans"],
                        "body-md": ["Public Sans"],
                        "headline-lg": ["Public Sans"],
                        "label-bold": ["Public Sans"],
                        "body-lg": ["Public Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-md text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container">
<main class="w-full max-w-md px-margin-mobile md:px-0">
<!-- Logo Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-md shadow-sm">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">Baladiya</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">Civic Services Portal</p>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-surface-container-high p-lg md:p-xl w-full relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-primary-container"></div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-gutter">Sign In</h2>
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-sm" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant/70 text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 bg-[#F3F4F6] border-[#D1D5DB] rounded-lg focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface h-12 transition-colors" id="email" name="email" placeholder="user@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-sm">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant/70 text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 bg-[#F3F4F6] border-[#D1D5DB] rounded-lg focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface h-12 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full flex justify-center items-center h-12 bg-primary hover:bg-primary-container text-on-primary font-label-bold text-label-bold rounded-lg shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary mt-gutter" type="submit">
                    Sign In to Portal
                    <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-gutter relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-highest"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface-container-lowest text-label-sm font-label-sm text-on-surface-variant">Or continue with</span>
</div>
</div>
<!-- NAS Biometric / SSO -->
<button class="mt-gutter w-full flex justify-center items-center h-12 bg-white border border-[#D1D5DB] hover:bg-surface-container-low text-primary font-label-bold text-label-bold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="button">
<span class="material-symbols-outlined mr-2 text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                National Authentication System
            </button>
</div>
<!-- Footer Links -->
<div class="mt-xl text-center space-x-gutter">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">About Baladiya</a>
<span class="text-surface-container-highest inline-block h-4 border-l border-surface-container-highest align-middle"></span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-surface-container-highest inline-block h-4 border-l border-surface-container-highest align-middle"></span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Help Center</a>
</div>
<!-- Secure Badge -->
<div class="mt-lg flex items-center justify-center text-on-surface-variant/60 font-label-sm text-label-sm gap-1 pb-xl">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span>Secure Government Portal</span>
</div>
</main>
</body></html>
