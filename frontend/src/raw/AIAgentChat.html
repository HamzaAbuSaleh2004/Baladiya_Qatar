<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar for chat area */
        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #ddbfc3;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md antialiased h-screen flex flex-col overflow-hidden">
<!-- TopAppBar (Shared Component) -->
<header class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-gray-800 transition-colors duration-200 fixed top-0 full-width z-50 flex justify-between items-center px-4 h-16 w-full flat no shadows">
<button class="text-rose-900 dark:text-rose-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full p-2 transition-colors duration-200 flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-['Public_Sans'] font-semibold text-xl font-bold text-rose-900 dark:text-rose-100">Baladiya</h1>
<div class="hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full p-1 transition-colors duration-200 cursor-pointer">
<img alt="User profile photo" class="w-8 h-8 rounded-full object-cover border border-gray-200" data-alt="professional headshot of a young man smiling slightly with short hair" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-Cx0G7qqe0dmDC2x1vY9AEFQUfpP63v48tswtU0PLsGdlzAfAlHYaNDdycDIM5S4TVyQo28kfat7G8N58GS6ZVLZY76H9dAnuw6mK6iUF5Foh_Dg1KgyNSrXb9XLIGvlNvVmWz7R4zC4S8FCw_c-icS31vhKS_l1HnmlRhnIyG4eWJV_0_yKOec09c_zubcVZKl-VVPN3QKLbNV66nJRKocmH5SAOBEPIc0XidHpWTwni8IJeiRFdR6jOCHHdLpqetRxwRx0F5aou"/>
</div>
</header>
<!-- Main Chat Canvas -->
<main class="flex-1 mt-16 pb-[88px] relative flex flex-col w-full max-w-container-max mx-auto">
<!-- Chat History -->
<div class="flex-1 overflow-y-auto chat-scroll p-4 md:p-gutter flex flex-col gap-6">
<!-- Timestamp -->
<div class="flex justify-center w-full mt-2">
<span class="font-label-sm text-label-sm text-secondary bg-surface-variant/50 px-3 py-1 rounded-full">Today, 10:42 AM</span>
</div>
<!-- User Message (Initial Report) -->
<div class="flex flex-col items-end w-full gap-1">
<div class="bg-primary text-on-primary rounded-xl rounded-tr-sm p-3 max-w-[85%] md:max-w-[70%] shadow-sm">
<img alt="Pothole" class="rounded-lg mb-3 w-full h-auto object-cover max-h-[200px]" data-alt="close up view of a large pothole on a paved asphalt city street during daytime" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWYp4ZraodRxLvZSH_w0Z4Onj1wOjDwE4kZuMv6sgDKyHSGRLo8Gjt12UQKNVTcSD8AJXJ78z1uUal27aQh7282e4lT3WMsfQ3rvnU7u3gTJenGOqiQGXPGflX82M3xLAasx0arzfqWQMBw3qwnpI_Uy5X6SR6aGmmrylx96R9KECuhcWx64OEp65RBOH8gPUUFMGqU-SW4rjqgaggO6m3R8qEu3E9PUm6DzoRE0jg8SXVJ4-vejZpxFb_DnbL6ZS7sInk_PntT94d"/>
<p class="font-body-md text-body-md">I want to report this severe road damage I just drove past. It looks dangerous.</p>
</div>
<span class="font-label-sm text-[10px] text-secondary mr-1">10:42 AM</span>
</div>
<!-- AI Agent Message (Analysis & Prompt) -->
<div class="flex gap-3 w-full max-w-[95%] md:max-w-[80%] items-start">
<!-- AI Avatar -->
<div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-surface-tint text-on-primary flex items-center justify-center shrink-0 shadow-sm mt-1">
<span class="material-symbols-outlined text-[18px] md:text-[22px]">smart_toy</span>
</div>
<div class="flex flex-col gap-2">
<!-- Bubble -->
<div class="bg-surface-container rounded-xl rounded-tl-sm p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-3">
<p class="font-body-md text-body-md text-on-surface">I've detected a pothole near Al Corniche Street. Could you confirm the street name or provide more details?</p>
<!-- Map Snippet inside bubble -->
<div class="rounded-lg overflow-hidden border border-outline-variant relative h-36 md:h-48 w-full bg-surface-dim">
<img alt="Map Location" class="w-full h-full object-cover opacity-90" data-alt="clean digital map snippet showing a coastal city street layout with a red location pin marker" data-location="Al Corniche Street, Doha, Qatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBaiskg67Np9Ni0fU8syxuAttG8mKjGiD5e3_CscuADKVP6mwluJV1lmKJuN80-ritByeK0AsuSIrsk49teVF66uWc1hKQ-MeJoJXjZP91sXNlmEcHdvSBMoc-8mLL2f0XKleoSQ_BJPWAUPVYk1zKRlTFE8j4ZYUPgnxnegesyPX9ITA8FGykL3VnQ6FwPw0W7IL06XVD7KcQWL7eqScN3wBFwbOPot-kgca-nfW2giAsKA43fU9TTfivdfSUfuXxcgHXW3NxkGYPN"/>
<!-- Location Overlay -->
<div class="absolute bottom-2 left-2 right-2 bg-surface/95 backdrop-blur-sm p-2 rounded-md border border-outline-variant/50 flex items-center gap-2 shadow-sm">
<div class="w-6 h-6 rounded-full bg-primary/10 text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[14px]">location_on</span>
</div>
<div class="flex flex-col">
<span class="font-label-bold text-label-bold text-on-surface leading-tight">Al Corniche Street</span>
<span class="font-label-sm text-[10px] text-secondary leading-tight">Doha, Qatar</span>
</div>
</div>
</div>
</div>
<!-- Smart Replies (Contextual Actions) -->
<div class="flex gap-2 flex-wrap mt-1">
<button class="bg-surface border border-outline-variant text-primary font-label-bold text-label-bold px-4 py-2 rounded-full hover:bg-surface-variant active:bg-surface-dim transition-colors shadow-sm">Yes, that's correct</button>
<button class="bg-surface border border-outline-variant text-on-surface-variant font-label-bold text-label-bold px-4 py-2 rounded-full hover:bg-surface-variant active:bg-surface-dim transition-colors shadow-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">edit_location</span>
                            Adjust pin
                        </button>
</div>
<span class="font-label-sm text-[10px] text-secondary ml-1 mt-1">10:43 AM</span>
</div>
</div>
</div>
</main>
<!-- Fixed Input Area (Replaces Bottom Nav for Task Focus) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant/40 px-4 py-3 shadow-[0_-8px_24px_rgba(0,0,0,0.04)] z-40">
<div class="max-w-container-max mx-auto flex items-end gap-3 pb-safe">
<!-- Attachment Button -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-secondary hover:text-primary hover:bg-surface-variant transition-colors shrink-0 mb-1">
<span class="material-symbols-outlined text-[24px]">add_circle</span>
</button>
<!-- Text Input Container -->
<div class="flex-1 bg-surface-container rounded-3xl border border-outline-variant/60 flex items-center px-4 py-1 min-h-[48px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary/20 transition-all">
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none font-body-md text-body-md text-on-surface py-2.5 max-h-[120px] outline-none placeholder:text-secondary-fixed-dim" placeholder="Type your reply or add details..." rows="1"></textarea>
<button class="text-secondary hover:text-primary p-1 ml-1 transition-colors">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
</div>
<!-- Send Button -->
<button class="w-12 h-12 bg-primary text-on-primary rounded-full flex items-center justify-center shrink-0 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm mb-0.5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</body></html>
